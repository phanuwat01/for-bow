<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Bow 💝</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loading-screen">
    <h1>Preparing your surprise... 💝</h1>
</div>

<div id="password-screen" style="display:none;">
    <h1>For Bow 💝</h1>
    <p>Enter our password</p>

    <input id="password" maxlength="6" placeholder="240326">

    <br><br>

    <button onclick="checkPassword()">Unlock 💝</button>

    <p id="error"></p>
</div>

<div id="welcome-screen" style="display:none;">
    <h1>Welcome, Bow 💝</h1>

    <p>
        เว็บนี้...
        <br>
        เวฟตั้งใจทำขึ้น
        <br><br>
        เพื่อคนคนเดียว
        <br><br>
        และคนนั้นก็คือโบว์ ❤️
    </p>

    <button id="music-btn">
        🎵 เปิดเพลงประกอบ
    </button>

    <br><br>

    <button id="start-btn">
        💌 เริ่มอ่านเรื่องราวของเรา
    </button>
</div>

<script src="script.js"></script>

</body>
</html>
